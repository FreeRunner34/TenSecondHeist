name: iOS build and tests
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  ios:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: xcode-select -p && xcodebuild -version
      - name: Verify authored campaign
        run: python3 tools/verify_levels.py
      - name: Build iPhone simulator app
        run: xcodebuild -project TenSecondHeist.xcodeproj -scheme TenSecondHeist -configuration Debug -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build
      - name: Run campaign and persistence tests
        run: |
          DEVICE=$(xcrun simctl list devices available | sed -n 's/.*iPhone 16 (\([^)]*\)).*/\1/p' | head -1)
          if [ -z "$DEVICE" ]; then DEVICE=$(xcrun simctl list devices available | sed -n 's/.*iPhone .* (\([^)]*\)).*/\1/p' | head -1); fi
          test -n "$DEVICE"
          xcodebuild -project TenSecondHeist.xcodeproj -scheme TenSecondHeist -configuration Debug -destination "platform=iOS Simulator,id=$DEVICE" CODE_SIGNING_ALLOWED=NO test
